[project]
name = "ndlpdf"
version = "0.1.0"
description = "Convert scanned PDF to searchable PDF using ndlocr-lite OCR"
readme = "README.md"
authors = [
    { name = "Minami Ueda", email = "minami.ueda@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ndlocr-lite",
    "pypdf>=6.10.1",
    "pypdfium2",
    "reportlab",
    "numpy",
    "pillow",
    "tqdm",
]

[project.scripts]
ndlpdf = "ndlpdf.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndlpdf"]

[tool.uv.sources]
ndlocr-lite = { git = "https://github.com/ndl-lab/ndlocr-lite", tag = "1.1.3" }

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["ndlpdf"]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
